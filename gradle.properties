kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Compose Hot Reload's task creation reads the root project's layout, which
# isolated projects forbid; the desktop skeleton does not use hot reload.
org.jetbrains.compose.hot.reload.disable=true
